name: Portfolio checks
on:
  push:
    branches:
      - main
      - design/purple-dual-theme
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check portfolio source and real project assets
        run: npm run test:source
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
